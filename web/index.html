<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>finley — ohtsim</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2312141a'/%3E%3Crect x='4' y='3' width='8' height='6' rx='1.5' fill='%236ea8fe'/%3E%3Crect x='6' y='10' width='4' height='3' fill='%23ffd866'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main>
    <header>
      <h1>ohtsim</h1>
      <p id="mapname">loading…</p>
    </header>
    <div id="stage">
      <canvas id="fab"></canvas>
    </div>
    <div id="legend">
      <span><i class="sw" data-state="0"></i>idle</span>
      <span><i class="sw" data-state="1"></i>to pickup</span>
      <span><i class="sw" data-state="2"></i>hoisting</span>
      <span><i class="sw" data-state="3"></i>to dropoff</span>
      <span><i class="sw" data-state="5"></i>repositioning</span>
      <span><i class="sw carrying"></i>carrying a lot</span>
      <span><i class="sw heat"></i>congestion</span>
    </div>
  </main>

  <aside>
    <section id="controls">
      <div class="row">
        <button id="play" class="primary">Pause</button>
        <button id="step">Step</button>
        <button id="reset">Reset</button>
      </div>
      <label class="field">
        <span>Speed <b id="speedlabel">4 ticks/frame</b></span>
        <input id="speed" type="range" min="0" max="6" step="1" value="3">
      </label>
      <label class="field">
        <span>Policy</span>
        <select id="policy">
          <option value="default">default</option>
          <option value="starvation_biased">starvation_biased</option>
        </select>
      </label>
      <p class="note" id="profile"></p>
    </section>

    <section>
      <h2>Throughput</h2>
      <dl id="metrics"></dl>
    </section>

    <section>
      <h2>Tools</h2>
      <p class="note">Bar is recent starvation; the number is queue depth.</p>
      <ul id="machines"></ul>
    </section>
  </aside>
</div>

<div id="error" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
